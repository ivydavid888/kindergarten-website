<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to our kindergarten website where we enrich young minds through play and learning.">
    <title>Kindergarten Website</title>
    <style>
        :root {
            --main-color: #f4b400;
            --secondary-color: #4285f4;
            --text-color: #333;
            --background-color: #fff;
            --font-family: 'Arial', sans-serif;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
        }
        header {
            background: var(--main-color);
            padding: 1em;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 1em 0;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: var(--secondary-color);
        }
        main {
            padding: 20px;
        }
        footer {
            text-align: center;
            padding: 1em 0;
            background: var(--main-color);
        }
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Kindergarten</h1>
        <nav aria-label="Main Navigation">
            <a href="#about">About Us</a>
            <a href="#programs">Programs</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>Our kindergarten provides a nurturing environment for children to explore and learn through play.</p>
        </section>
        <section id="programs">
            <h2>Programs</h2>
            <p>We offer various educational programs designed for every child.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Kindergarten Website</p>
    </footer>
</body>
</html>
